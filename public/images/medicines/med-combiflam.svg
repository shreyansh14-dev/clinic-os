<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <defs>
    <linearGradient id="foil-med-combiflam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="75%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="brandGrad-med-combiflam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
    <filter id="dropShadow-med-combiflam" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <radialGradient id="pillShine-med-combiflam" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.6" />
    </radialGradient>
  </defs>

  <rect width="320" height="220" rx="20" fill="#f8fafc" />
  <circle cx="260" cy="50" r="70" fill="#fed7aa" opacity="0.12" />

  <!-- Blister Foil Strip -->
  <g filter="url(#dropShadow-med-combiflam)">
    <rect x="30" y="24" width="260" height="172" rx="14" fill="url(#foil-med-combiflam)" stroke="#94a3b8" stroke-width="1.5" />
    <!-- Perforation Lines -->
    <line x1="30" y1="102" x2="290" y2="102" stroke="#94a3b8" stroke-dasharray="3,3" stroke-width="1" opacity="0.6" />
    <line x1="116" y1="24" x2="116" y2="196" stroke="#94a3b8" stroke-dasharray="3,3" stroke-width="1" opacity="0.6" />
    <line x1="204" y1="24" x2="204" y2="196" stroke="#94a3b8" stroke-width="1" opacity="0.6" />

    <!-- Top Brand Header Ribbon on Foil -->
    <rect x="30" y="24" width="260" height="30" rx="12" fill="url(#brandGrad-med-combiflam)" />
    <rect x="30" y="44" width="260" height="10" fill="url(#brandGrad-med-combiflam)" />
    <text x="44" y="45" fill="#ffffff" font-family="'Poppins',system-ui,sans-serif" font-weight="900" font-size="12" letter-spacing="0.5">COMBIFLAM</text>
    <rect x="230" y="30" width="50" height="18" rx="6" fill="#ffffff" fill-opacity="0.25" />
    <text x="255" y="43" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="8.5" text-anchor="middle">400+325</text>
  </g>

  <!-- 6 Embossed Pill Cavities -->
  <g>
    <ellipse cx="73" cy="74" rx="21" ry="21" fill="url(#pillShine-med-combiflam)" stroke="#64748b" stroke-width="1.2" filter="url(#dropShadow-med-combiflam)" />
    <ellipse cx="160" cy="74" rx="21" ry="21" fill="url(#pillShine-med-combiflam)" stroke="#64748b" stroke-width="1.2" filter="url(#dropShadow-med-combiflam)" />
    <ellipse cx="247" cy="74" rx="21" ry="21" fill="url(#pillShine-med-combiflam)" stroke="#64748b" stroke-width="1.2" filter="url(#dropShadow-med-combiflam)" />

    <ellipse cx="73" cy="144" rx="21" ry="21" fill="url(#pillShine-med-combiflam)" stroke="#64748b" stroke-width="1.2" filter="url(#dropShadow-med-combiflam)" />
    <ellipse cx="160" cy="144" rx="21" ry="21" fill="url(#pillShine-med-combiflam)" stroke="#64748b" stroke-width="1.2" filter="url(#dropShadow-med-combiflam)" />
    <ellipse cx="247" cy="144" rx="21" ry="21" fill="url(#pillShine-med-combiflam)" stroke="#64748b" stroke-width="1.2" filter="url(#dropShadow-med-combiflam)" />

    

    
  </g>

  <!-- Bottom Foil Print -->
  <text x="160" y="186" fill="#64748b" font-family="sans-serif" font-weight="600" font-size="8.5" text-anchor="middle" letter-spacing="0.3">Ibuprofen + Para</text>
</svg>