<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>ClinicOS — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;min-height:100vh;background:#0b1120;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.bg-blobs{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.35;animation:drift 8s ease-in-out infinite alternate}
.blob1{width:500px;height:500px;background:radial-gradient(circle,#2563eb,#1e40af);top:-100px;left:-100px;animation-delay:0s}
.blob2{width:400px;height:400px;background:radial-gradient(circle,#7c3aed,#4f46e5);bottom:-80px;right:-80px;animation-delay:2s}
.blob3{width:300px;height:300px;background:radial-gradient(circle,#0ea5e9,#0284c7);top:40%;left:50%;animation-delay:4s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(20px,20px) scale(1.05)}}
.card{background:rgba(15,23,42,.85);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:48px 44px;width:460px;max-width:95vw;position:relative;z-index:10;box-shadow:0 32px 80px rgba(0,0,0,.6)}
.logo{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:8px}
.logo-icon{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#2563eb,#0ea5e9);display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 8px 24px rgba(37,99,235,.4)}
.logo-text{font-size:26px;font-weight:800;color:#fff;letter-spacing:-0.5px}
.logo-text span{color:#38bdf8}
.tagline{text-align:center;color:#94a3b8;font-size:13px;margin-bottom:32px}
.tabs{display:flex;background:rgba(255,255,255,.04);border-radius:12px;padding:4px;margin-bottom:28px}
.tab{flex:1;padding:10px;text-align:center;border-radius:9px;cursor:pointer;font-size:14px;font-weight:500;color:#64748b;transition:all .2s}
.tab.active{background:linear-gradient(135deg,#2563eb,#0ea5e9);color:#fff;box-shadow:0 4px 12px rgba(37,99,235,.3)}
.form-group{margin-bottom:18px}
label{display:block;font-size:12px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px}
input,select{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:13px 16px;color:#f1f5f9;font-size:14px;font-family:'Inter',sans-serif;outline:none;transition:all .2s}
input:focus,select:focus{border-color:#2563eb;background:rgba(37,99,235,.08);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
input::placeholder{color:#475569}
select option{background:#1e293b;color:#f1f5f9}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.btn-primary{width:100%;padding:15px;border-radius:12px;border:none;cursor:pointer;background:linear-gradient(135deg,#2563eb,#0ea5e9);color:#fff;font-size:15px;font-weight:700;font-family:'Inter',sans-serif;transition:all .25s;box-shadow:0 4px 20px rgba(37,99,235,.35);margin-top:4px;letter-spacing:.3px}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(37,99,235,.5)}
.btn-primary:active{transform:translateY(0)}
.btn-primary:disabled{opacity:.6;transform:none;cursor:not-allowed}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0}
.divider span{font-size:12px;color:#475569}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.08)}
.demo-box{background:rgba(37,99,235,.08);border:1px solid rgba(37,99,235,.2);border-radius:10px;padding:14px 16px;margin-bottom:20px}
.demo-box p{font-size:11px;color:#94a3b8;line-height:1.7}
.demo-box strong{color:#38bdf8;font-size:11.5px}
.error-msg{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:10px 14px;color:#fca5a5;font-size:13px;margin-bottom:16px;display:none}
.success-msg{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3);border-radius:8px;padding:10px 14px;color:#86efac;font-size:13px;margin-bottom:16px;display:none}
.doctor-fields{display:none}
.spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.role-pills{display:flex;gap:10px;margin-bottom:6px}
.role-pill{flex:1;padding:10px;border-radius:9px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);cursor:pointer;text-align:center;font-size:13px;color:#94a3b8;transition:all .2s;font-family:'Inter',sans-serif}
.role-pill.selected{border-color:#2563eb;background:rgba(37,99,235,.12);color:#60a5fa;font-weight:600}
.features{display:flex;gap:16px;margin-top:24px;padding-top:20px;border-top:1px solid rgba(255,255,255,.06)}
.feature{flex:1;text-align:center}
.feature-icon{font-size:20px;margin-bottom:4px}
.feature-text{font-size:10.5px;color:#64748b;font-weight:500}
</style>
</head>
<body>
<div class="bg-blobs">
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>
</div>

<div class="card">
  <div class="logo">
    <div class="logo-icon">🏥</div>
    <div class="logo-text">Clinic<span>OS</span></div>
  </div>
  <p class="tagline">India's Trusted Digital Health Platform</p>

  <div class="tabs">
    <div class="tab active" id="tab-login" onclick="switchTab('login')">Login</div>
    <div class="tab" id="tab-register" onclick="switchTab('register')">Create Account</div>
  </div>

  <!-- Error / Success -->
  <div class="error-msg" id="error-msg"></div>
  <div class="success-msg" id="success-msg"></div>

  <!-- LOGIN FORM -->
  <form id="login-form" onsubmit="doLogin(event)">
    <div class="demo-box">
      <p>🔐 <strong>Demo Credentials</strong></p>
      <p>Patient: <strong>patient@demo.com</strong> / <strong>Patient@123</strong></p>
      <p>Doctor: <strong>robert.chen@clinicos.health</strong> / <strong>Doctor@123</strong></p>
    </div>
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="login-email" placeholder="Enter your email" required/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="login-password" placeholder="Enter your password" required/>
    </div>
    <button type="submit" class="btn-primary" id="login-btn">Login to ClinicOS</button>
  </form>

  <!-- REGISTER FORM -->
  <form id="register-form" style="display:none" onsubmit="doRegister(event)">
    <div class="form-group">
      <label>I am registering as</label>
      <div class="role-pills">
        <button type="button" class="role-pill selected" id="role-patient" onclick="selectRole('patient')">🏥 Patient</button>
        <button type="button" class="role-pill" id="role-doctor" onclick="selectRole('doctor')">👨‍⚕️ Doctor</button>
      </div>
      <input type="hidden" id="reg-role" value="patient"/>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="reg-name" placeholder="Your full name" required/>
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="tel" id="reg-phone" placeholder="+91 XXXXX XXXXX"/>
      </div>
    </div>
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="reg-email" placeholder="your@email.com" required/>
    </div>
    <div class="form-group">
      <label>Password (min. 6 characters)</label>
      <input type="password" id="reg-password" placeholder="Create a strong password" required/>
    </div>
    <div class="doctor-fields" id="doctor-extra">
      <div class="form-row">
        <div class="form-group">
          <label>Specialty</label>
          <select id="reg-specialty">
            <option>General Medicine</option>
            <option>Cardiology</option>
            <option>Neurology</option>
            <option>Orthopedics</option>
            <option>Paediatrics</option>
            <option>Dermatology</option>
            <option>Gynaecology</option>
            <option>Psychiatry</option>
          </select>
        </div>
        <div class="form-group">
          <label>Consultation Fee (₹)</label>
          <input type="number" id="reg-fee" placeholder="499" min="100"/>
        </div>
      </div>
      <div class="form-group">
        <label>Experience</label>
        <input type="text" id="reg-exp" placeholder="e.g. 5 years"/>
      </div>
    </div>
    <button type="submit" class="btn-primary" id="reg-btn">Create Account</button>
  </form>

  <div class="features">
    <div class="feature"><div class="feature-icon">🔒</div><div class="feature-text">End-to-End Encrypted</div></div>
    <div class="feature"><div class="feature-icon">🏅</div><div class="feature-text">ABDM Compliant</div></div>
    <div class="feature"><div class="feature-icon">⚡</div><div class="feature-text">Instant Consultation</div></div>
    <div class="feature"><div class="feature-icon">💊</div><div class="feature-text">Medicine Delivery</div></div>
  </div>
</div>

<script>
let currentTab='login';
let currentRole='patient';

function switchTab(tab){
  currentTab=tab;
  document.getElementById('tab-login').classList.toggle('active',tab==='login');
  document.getElementById('tab-register').classList.toggle('active',tab==='register');
  document.getElementById('login-form').style.display=tab==='login'?'block':'none';
  document.getElementById('register-form').style.display=tab==='register'?'block':'none';
  hideMessages();
}

function selectRole(role){
  currentRole=role;
  document.getElementById('reg-role').value=role;
  document.getElementById('role-patient').classList.toggle('selected',role==='patient');
  document.getElementById('role-doctor').classList.toggle('selected',role==='doctor');
  document.getElementById('doctor-extra').style.display=role==='doctor'?'block':'none';
}

function showError(msg){
  const el=document.getElementById('error-msg');
  el.textContent=msg; el.style.display='block';
  document.getElementById('success-msg').style.display='none';
}
function showSuccess(msg){
  const el=document.getElementById('success-msg');
  el.textContent=msg; el.style.display='block';
  document.getElementById('error-msg').style.display='none';
}
function hideMessages(){
  document.getElementById('error-msg').style.display='none';
  document.getElementById('success-msg').style.display='none';
}

async function doLogin(e){
  e.preventDefault();
  const btn=document.getElementById('login-btn');
  btn.innerHTML='<span class="spinner"></span> Signing in...';
  btn.disabled=true; hideMessages();
  try{
    const res=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email:document.getElementById('login-email').value,
                           password:document.getElementById('login-password').value})});
    const data=await res.json();
    if(!res.ok) throw new Error(data.error||'Login failed');
    showSuccess('Login successful! Redirecting…');
    setTimeout(()=>location.href='/dashboard',800);
  }catch(err){
    showError(err.message);
    btn.innerHTML='Login to ClinicOS'; btn.disabled=false;
  }
}

async function doRegister(e){
  e.preventDefault();
  const btn=document.getElementById('reg-btn');
  btn.innerHTML='<span class="spinner"></span> Creating account...';
  btn.disabled=true; hideMessages();
  const body={
    name:document.getElementById('reg-name').value,
    email:document.getElementById('reg-email').value,
    password:document.getElementById('reg-password').value,
    phone:document.getElementById('reg-phone').value,
    role:document.getElementById('reg-role').value,
  };
  if(currentRole==='doctor'){
    body.specialty=document.getElementById('reg-specialty').value;
    body.fee=document.getElementById('reg-fee').value||499;
    body.experience=document.getElementById('reg-exp').value||'1 year';
  }
  try{
    const res=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body)});
    const data=await res.json();
    if(!res.ok) throw new Error(data.error||'Registration failed');
    showSuccess('Account created! Redirecting to dashboard…');
    setTimeout(()=>location.href='/dashboard',1000);
  }catch(err){
    showError(err.message);
    btn.innerHTML='Create Account'; btn.disabled=false;
  }
}
</script>
</body>
</html>
