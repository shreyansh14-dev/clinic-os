<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>ClinicOS — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#060d1a;--surface:#0d1829;--surface2:#111f35;--surface3:#162240;
  --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.12);
  --blue:#2563eb;--blue-light:#3b82f6;--cyan:#0ea5e9;
  --green:#10b981;--red:#ef4444;--yellow:#f59e0b;--purple:#8b5cf6;
  --text:#f1f5f9;--text2:#94a3b8;--text3:#64748b;
  --radius:14px;--radius-sm:9px;--radius-lg:20px;
  --shadow:0 8px 32px rgba(0,0,0,.4);
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;overflow:hidden}

/* ── SIDEBAR ── */
.sidebar{width:240px;min-height:100vh;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;z-index:100;transition:transform .3s}
.sidebar-logo{padding:22px 20px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sidebar-logo .icon{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--cyan));display:flex;align-items:center;justify-content:center;font-size:18px}
.sidebar-logo .name{font-size:19px;font-weight:800;color:var(--text);letter-spacing:-.3px}
.sidebar-logo .name span{color:#38bdf8}
.sidebar-nav{flex:1;padding:16px 12px;overflow-y:auto}
.nav-section{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1px;padding:8px 8px 4px;margin-top:8px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);cursor:pointer;color:var(--text2);font-size:13.5px;font-weight:500;transition:all .18s;margin-bottom:2px;position:relative}
.nav-item:hover{background:rgba(255,255,255,.05);color:var(--text)}
.nav-item.active{background:linear-gradient(135deg,rgba(37,99,235,.25),rgba(14,165,233,.15));color:#60a5fa;font-weight:600}
.nav-item.active::before{content:'';position:absolute;left:0;top:25%;bottom:25%;width:3px;background:linear-gradient(var(--blue),var(--cyan));border-radius:0 3px 3px 0}
.nav-item .icon{font-size:17px;width:22px;text-align:center}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;border-radius:20px;padding:2px 7px;font-size:10px;font-weight:700}
.sidebar-user{padding:16px 12px;border-top:1px solid var(--border)}
.user-card{background:rgba(255,255,255,.04);border-radius:var(--radius-sm);padding:10px 12px;display:flex;align-items:center;gap:10px}
.user-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--purple));display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;flex-shrink:0;overflow:hidden}
.user-avatar img{width:100%;height:100%;object-fit:cover}
.user-info .name{font-size:13px;font-weight:600;color:var(--text)}
.user-info .role{font-size:11px;color:var(--text3);text-transform:capitalize}
.btn-logout{width:100%;margin-top:8px;padding:8px;border-radius:var(--radius-sm);border:1px solid rgba(239,68,68,.25);background:rgba(239,68,68,.07);color:#fca5a5;font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s}
.btn-logout:hover{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.5)}

/* ── MAIN ── */
.main{margin-left:240px;flex:1;min-height:100vh;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:60px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 28px;gap:16px;position:sticky;top:0;z-index:50}
.topbar-title{font-size:17px;font-weight:700;color:var(--text);flex:1}
.topbar-search{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 14px;width:260px}
.topbar-search input{background:none;border:none;outline:none;color:var(--text);font-size:13px;font-family:'Inter',sans-serif;width:100%}
.topbar-search input::placeholder{color:var(--text3)}
.notif-btn{width:38px;height:38px;border-radius:9px;background:rgba(255,255,255,.05);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:17px;transition:all .2s}
.notif-btn:hover{background:rgba(255,255,255,.08)}
.content{flex:1;padding:28px;overflow-y:auto;max-height:calc(100vh - 60px)}

/* ── CARDS ── */
.page{display:none}
.page.active{display:block;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.page-header{margin-bottom:24px}
.page-header h1{font-size:24px;font-weight:800;color:var(--text);margin-bottom:4px}
.page-header p{font-size:14px;color:var(--text2)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px}
.card-sm{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}

/* ── STAT CARDS ── */
.stat-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;position:relative;overflow:hidden;cursor:default}
.stat-card::before{content:'';position:absolute;top:-30px;right:-30px;width:100px;height:100px;border-radius:50%;opacity:.08}
.stat-card.blue::before{background:var(--blue)}
.stat-card.green::before{background:var(--green)}
.stat-card.yellow::before{background:var(--yellow)}
.stat-card.purple::before{background:var(--purple)}
.stat-icon{font-size:28px;margin-bottom:12px}
.stat-value{font-size:28px;font-weight:800;color:var(--text);margin-bottom:4px}
.stat-label{font-size:12.5px;color:var(--text2);font-weight:500}
.stat-change{font-size:11px;margin-top:6px;font-weight:600}
.stat-change.up{color:var(--green)}
.stat-change.neutral{color:var(--text3)}

/* ── BUTTONS ── */
.btn{padding:10px 20px;border-radius:var(--radius-sm);border:none;cursor:pointer;font-size:13.5px;font-weight:600;font-family:'Inter',sans-serif;transition:all .2s;display:inline-flex;align-items:center;gap:7px}
.btn-primary{background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;box-shadow:0 4px 14px rgba(37,99,235,.3)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(37,99,235,.45)}
.btn-secondary{background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--border2)}
.btn-secondary:hover{background:rgba(255,255,255,.1)}
.btn-danger{background:rgba(239,68,68,.12);color:#fca5a5;border:1px solid rgba(239,68,68,.25)}
.btn-danger:hover{background:rgba(239,68,68,.2)}
.btn-green{background:linear-gradient(135deg,#059669,var(--green));color:#fff}
.btn-sm{padding:7px 14px;font-size:12px}
.btn-lg{padding:14px 28px;font-size:15px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* ── SPECIALTY GRID ── */
.specialty-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.spec-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:22px 16px;text-align:center;cursor:pointer;transition:all .22s;position:relative;overflow:hidden}
.spec-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(37,99,235,.0),rgba(14,165,233,.0));transition:all .22s}
.spec-card:hover{border-color:rgba(37,99,235,.4);transform:translateY(-3px)}
.spec-card:hover::before{background:linear-gradient(135deg,rgba(37,99,235,.08),rgba(14,165,233,.05))}
.spec-icon{font-size:36px;margin-bottom:10px}
.spec-name{font-size:13.5px;font-weight:700;color:var(--text);margin-bottom:4px}
.spec-desc{font-size:11px;color:var(--text3)}

/* ── DOCTOR CARDS ── */
.doctor-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;display:flex;gap:16px;cursor:pointer;transition:all .2s}
.doctor-card:hover{border-color:rgba(37,99,235,.35);background:var(--surface3)}
.doc-avatar{width:72px;height:72px;border-radius:50%;object-fit:cover;border:2px solid var(--border2);flex-shrink:0;background:var(--surface3)}
.doc-avatar-placeholder{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--purple));display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:#fff;flex-shrink:0}
.doc-info{flex:1}
.doc-name{font-size:15.5px;font-weight:700;color:var(--text);margin-bottom:4px}
.doc-spec{font-size:12px;color:var(--cyan);font-weight:600;background:rgba(14,165,233,.1);border-radius:20px;display:inline-block;padding:2px 10px;margin-bottom:8px}
.doc-meta{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:8px}
.doc-meta-item{font-size:11.5px;color:var(--text2);display:flex;align-items:center;gap:4px}
.stars{color:#f59e0b;font-size:12px}
.doc-fee{font-size:16px;font-weight:800;color:var(--green)}
.doc-fee span{font-size:11px;color:var(--text3);font-weight:400}
.doc-hosp{font-size:11px;color:var(--text3);margin-top:2px}
.available-badge{background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.25);color:#6ee7b7;border-radius:20px;padding:3px 10px;font-size:10.5px;font-weight:600}

/* ── SLOTS ── */
.slots-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.slot-btn{padding:10px 8px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:rgba(255,255,255,.04);color:var(--text2);font-size:12.5px;font-weight:500;cursor:pointer;text-align:center;transition:all .18s;font-family:'Inter',sans-serif}
.slot-btn:hover:not(.booked){border-color:var(--blue);background:rgba(37,99,235,.08);color:#60a5fa}
.slot-btn.selected{background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;border-color:transparent}
.slot-btn.booked{opacity:.35;cursor:not-allowed;text-decoration:line-through}

/* ── DATE PICKER ── */
.date-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.date-chip{flex-shrink:0;padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--border2);cursor:pointer;text-align:center;transition:all .18s;min-width:68px}
.date-chip .day{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.date-chip .num{font-size:20px;font-weight:800;color:var(--text);margin:2px 0}
.date-chip .mon{font-size:10px;color:var(--text2);font-weight:600}
.date-chip:hover,.date-chip.selected{border-color:var(--blue);background:rgba(37,99,235,.1)}
.date-chip.selected .num{color:#60a5fa}

/* ── PAYMENT ── */
.payment-methods{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.pay-method{flex:1;min-width:100px;padding:14px 12px;border-radius:var(--radius-sm);border:2px solid var(--border);background:var(--surface2);cursor:pointer;text-align:center;transition:all .2s;font-family:'Inter',sans-serif}
.pay-method.active{border-color:var(--blue);background:rgba(37,99,235,.1)}
.pay-method .pm-icon{font-size:24px;margin-bottom:6px}
.pay-method .pm-name{font-size:12px;font-weight:600;color:var(--text2)}
.qr-box{text-align:center;padding:24px;background:var(--surface2);border-radius:var(--radius);border:1px solid var(--border)}
.qr-box .qr-img{background:#fff;padding:16px;border-radius:12px;display:inline-block;margin-bottom:12px}
.qr-box .upi-id{font-size:14px;font-weight:700;color:var(--cyan);margin-bottom:4px}
.qr-box .upi-note{font-size:12px;color:var(--text3)}
.pay-input-group{margin-bottom:16px}
.pay-input-group label{display:block;font-size:11.5px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.pay-input-group input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:12px 14px;color:var(--text);font-size:14px;font-family:'Inter',sans-serif;outline:none}
.pay-input-group input:focus{border-color:var(--blue)}
.pay-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ── MEDICINES ── */
.med-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:18px;transition:all .2s;position:relative}
.med-card:hover{border-color:rgba(37,99,235,.3)}
.med-emoji{font-size:36px;margin-bottom:10px}
.med-name{font-size:13.5px;font-weight:700;color:var(--text);margin-bottom:3px}
.med-generic{font-size:11px;color:var(--text3);margin-bottom:8px}
.med-cat{font-size:10.5px;font-weight:600;background:rgba(139,92,246,.12);color:#c4b5fd;border-radius:20px;padding:2px 9px;display:inline-block;margin-bottom:10px}
.med-price{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.med-price .price{font-size:17px;font-weight:800;color:var(--green)}
.med-price .mrp{font-size:12px;color:var(--text3);text-decoration:line-through}
.med-price .disc{font-size:11px;font-weight:700;color:var(--yellow)}
.rx-badge{position:absolute;top:12px;right:12px;background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.3);color:#fcd34d;font-size:9px;font-weight:700;border-radius:4px;padding:2px 6px}
.cat-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.cat-chip{padding:7px 16px;border-radius:20px;border:1px solid var(--border2);background:var(--surface2);color:var(--text2);font-size:12.5px;font-weight:500;cursor:pointer;transition:all .18s;font-family:'Inter',sans-serif}
.cat-chip.active,.cat-chip:hover{border-color:var(--blue);background:rgba(37,99,235,.1);color:#60a5fa}

/* ── CART ── */
.cart-sidebar{position:fixed;right:0;top:0;bottom:0;width:340px;background:var(--surface);border-left:1px solid var(--border);z-index:200;transform:translateX(100%);transition:transform .3s;display:flex;flex-direction:column}
.cart-sidebar.open{transform:translateX(0)}
.cart-header{padding:20px 20px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.cart-header h3{flex:1;font-size:16px;font-weight:700}
.cart-close{width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.05);border:none;cursor:pointer;color:var(--text2);font-size:18px;display:flex;align-items:center;justify-content:center}
.cart-items{flex:1;overflow-y:auto;padding:16px}
.cart-item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--surface2);border-radius:var(--radius-sm);margin-bottom:10px}
.cart-item-emoji{font-size:24px;width:40px;text-align:center}
.cart-item-info{flex:1}
.cart-item-name{font-size:13px;font-weight:600;color:var(--text);margin-bottom:2px}
.cart-item-price{font-size:12px;color:var(--green);font-weight:700}
.cart-qty{display:flex;align-items:center;gap:8px}
.qty-btn{width:26px;height:26px;border-radius:6px;border:1px solid var(--border2);background:rgba(255,255,255,.05);color:var(--text);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;transition:all .15s}
.qty-btn:hover{background:rgba(255,255,255,.1)}
.qty-num{font-size:13px;font-weight:700;color:var(--text);min-width:20px;text-align:center}
.cart-footer{padding:16px 20px;border-top:1px solid var(--border)}
.cart-total{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.cart-total .label{font-size:13px;color:var(--text2)}
.cart-total .amount{font-size:20px;font-weight:800;color:var(--green)}
.cart-icon-btn{position:fixed;bottom:28px;right:28px;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--cyan));border:none;cursor:pointer;font-size:24px;box-shadow:0 8px 24px rgba(37,99,235,.4);z-index:150;display:flex;align-items:center;justify-content:center;transition:all .2s}
.cart-icon-btn:hover{transform:scale(1.08)}
.cart-count{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;border-radius:50%;width:22px;height:22px;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}

/* ── APPOINTMENTS ── */
.appt-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;display:flex;align-items:center;gap:16px;transition:all .2s;margin-bottom:12px}
.appt-card:hover{border-color:rgba(37,99,235,.25)}
.appt-avatar{width:56px;height:56px;border-radius:50%;object-fit:cover;flex-shrink:0;background:linear-gradient(135deg,var(--blue),var(--purple));display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#fff;overflow:hidden}
.appt-avatar img{width:100%;height:100%;object-fit:cover}
.appt-info{flex:1}
.appt-doc-name{font-size:14.5px;font-weight:700;color:var(--text);margin-bottom:3px}
.appt-spec{font-size:12px;color:var(--cyan);font-weight:600}
.appt-meta{display:flex;gap:14px;margin-top:6px;flex-wrap:wrap}
.appt-meta-item{font-size:11.5px;color:var(--text2);display:flex;align-items:center;gap:4px}
.status-badge{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700}
.status-confirmed{background:rgba(16,185,129,.12);color:#6ee7b7;border:1px solid rgba(16,185,129,.25)}
.status-pending{background:rgba(245,158,11,.12);color:#fcd34d;border:1px solid rgba(245,158,11,.25)}
.status-completed{background:rgba(100,116,139,.12);color:#94a3b8;border:1px solid rgba(100,116,139,.25)}
.status-cancelled{background:rgba(239,68,68,.12);color:#fca5a5;border:1px solid rgba(239,68,68,.25)}

/* ── VIDEO CALL ── */
.video-room{position:fixed;inset:0;background:#000;z-index:500;display:flex;flex-direction:column}
.video-header{padding:16px 24px;background:rgba(0,0,0,.6);display:flex;align-items:center;gap:14px;position:absolute;top:0;left:0;right:0;z-index:10}
.video-header .doc-info{flex:1}
.video-header .doc-info h3{font-size:16px;font-weight:700;color:#fff}
.video-header .doc-info p{font-size:12px;color:rgba(255,255,255,.6)}
.video-main{flex:1;position:relative;background:#0a0f1a}
#remoteVideo{width:100%;height:100%;object-fit:cover;background:#0a1220}
#localVideo{position:absolute;bottom:100px;right:24px;width:180px;height:130px;border-radius:14px;object-fit:cover;border:2px solid rgba(255,255,255,.2);background:#0d1829}
.video-controls{position:absolute;bottom:0;left:0;right:0;padding:20px 24px;background:linear-gradient(transparent,rgba(0,0,0,.85));display:flex;justify-content:center;gap:16px;z-index:10}
.vc-btn{width:56px;height:56px;border-radius:50%;border:none;cursor:pointer;font-size:22px;display:flex;align-items:center;justify-content:center;transition:all .2s;font-family:'Inter',sans-serif}
.vc-btn.mute{background:rgba(255,255,255,.12)}
.vc-btn.mute:hover{background:rgba(255,255,255,.2)}
.vc-btn.mute.active{background:rgba(239,68,68,.3)}
.vc-btn.end{background:#ef4444;box-shadow:0 4px 20px rgba(239,68,68,.5)}
.vc-btn.end:hover{background:#dc2626}
.call-waiting{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#060d1a}
.call-waiting .ring{width:140px;height:140px;border-radius:50%;border:3px solid rgba(37,99,235,.3);display:flex;align-items:center;justify-content:center;animation:ring-pulse 2s ease infinite}
.call-waiting .ring2{width:110px;height:110px;border-radius:50%;border:2px solid rgba(37,99,235,.4);display:flex;align-items:center;justify-content:center;animation:ring-pulse 2s ease infinite .4s}
.call-waiting .ring3{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--cyan));display:flex;align-items:center;justify-content:center;font-size:32px}
@keyframes ring-pulse{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.05);opacity:1}}
.call-waiting h3{font-size:22px;font-weight:700;margin-top:24px;color:#fff}
.call-waiting p{font-size:14px;color:rgba(255,255,255,.5);margin-top:6px}
.call-timer{font-size:20px;font-weight:700;color:#fff;margin-top:16px;font-variant-numeric:tabular-nums}

/* ── VACCINATION ── */
.baby-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:14px}
.vaccine-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:var(--radius-sm);margin-bottom:8px;border:1px solid var(--border)}
.vaccine-status{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.v-done{background:rgba(16,185,129,.15);color:var(--green)}
.v-pending{background:rgba(100,116,139,.1);color:var(--text3)}
.v-overdue{background:rgba(239,68,68,.12);color:#fca5a5}
.vaccine-info{flex:1}
.vaccine-info .v-name{font-size:13px;font-weight:600;color:var(--text)}
.vaccine-info .v-age{font-size:11px;color:var(--text3)}
.vaccine-date{font-size:11px;color:var(--text2);text-align:right}

/* ── PRESCRIPTION ── */
.rx-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:14px}
.rx-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.rx-logo{font-size:28px}
.rx-title{font-size:15px;font-weight:700;color:var(--text)}
.rx-date{font-size:11px;color:var(--text3)}
.rx-med-row{display:flex;align-items:center;gap:10px;padding:8px 12px;background:rgba(255,255,255,.03);border-radius:var(--radius-sm);margin-bottom:6px}
.rx-med-row .name{flex:1;font-size:13px;font-weight:600;color:var(--text)}
.rx-med-row .dosage{font-size:11.5px;color:var(--text3)}
.rx-med-row .duration{font-size:11.5px;color:var(--cyan);font-weight:600;min-width:70px;text-align:right}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);z-index:400;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex;animation:fadeIn .2s ease}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:20px;padding:32px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto;position:relative}
.modal h2{font-size:20px;font-weight:800;margin-bottom:6px}
.modal p.sub{font-size:13px;color:var(--text2);margin-bottom:24px}
.modal-close{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:8px;border:1px solid var(--border2);background:rgba(255,255,255,.05);color:var(--text2);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:11.5px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.form-group input,.form-group select,.form-group textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:11px 14px;color:var(--text);font-size:13.5px;font-family:'Inter',sans-serif;outline:none;transition:border .2s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--blue)}
.form-group select option{background:#1e293b}
.form-group textarea{resize:vertical;min-height:80px}
.form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ── MISC ── */
.empty-state{text-align:center;padding:60px 20px;color:var(--text3)}
.empty-state .icon{font-size:56px;margin-bottom:16px;opacity:.6}
.empty-state h3{font-size:16px;font-weight:600;color:var(--text2);margin-bottom:6px}
.empty-state p{font-size:13px}
.success-banner{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.25);border-radius:var(--radius-sm);padding:14px 18px;display:flex;align-items:center;gap:10px;color:#6ee7b7;font-size:13px;font-weight:500;margin-bottom:16px}
.error-banner{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);border-radius:var(--radius-sm);padding:14px 18px;display:flex;align-items:center;gap:10px;color:#fca5a5;font-size:13px;font-weight:500;margin-bottom:16px}
.info-banner{background:rgba(37,99,235,.08);border:1px solid rgba(37,99,235,.2);border-radius:var(--radius-sm);padding:14px 18px;display:flex;align-items:center;gap:10px;color:#93c5fd;font-size:13px;font-weight:500;margin-bottom:16px}
.divider{height:1px;background:var(--border);margin:20px 0}
.spinner{width:20px;height:20px;border:2.5px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{display:flex;align-items:center;justify-content:center;padding:48px;gap:12px;color:var(--text2)}
.section-title{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.back-btn{display:inline-flex;align-items:center;gap:6px;color:var(--text2);font-size:13px;font-weight:600;cursor:pointer;margin-bottom:18px;padding:7px 12px;border-radius:var(--radius-sm);transition:all .2s}
.back-btn:hover{background:rgba(255,255,255,.05);color:var(--text)}
.order-status-chip{padding:3px 10px;border-radius:20px;font-size:10.5px;font-weight:700;display:inline-block}
.os-placed{background:rgba(37,99,235,.12);color:#93c5fd}
.os-processing{background:rgba(245,158,11,.12);color:#fcd34d}
.os-dispatched{background:rgba(139,92,246,.12);color:#c4b5fd}
.os-delivered{background:rgba(16,185,129,.12);color:#6ee7b7}
.progress-steps{display:flex;margin-bottom:28px}
.step{flex:1;text-align:center;position:relative}
.step::before{content:'';position:absolute;top:18px;left:50%;right:-50%;height:2px;background:var(--border);z-index:0}
.step:last-child::before{display:none}
.step.done::before{background:linear-gradient(90deg,var(--blue),var(--cyan))}
.step-circle{width:36px;height:36px;border-radius:50%;background:var(--surface2);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;margin:0 auto 6px;position:relative;z-index:1;transition:all .3s}
.step.done .step-circle{background:linear-gradient(135deg,var(--blue),var(--cyan));border-color:transparent;color:#fff}
.step.current .step-circle{border-color:var(--blue);color:#60a5fa}
.step-label{font-size:11px;color:var(--text3);font-weight:600}
.step.done .step-label,.step.current .step-label{color:var(--text2)}
.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10.5px;font-weight:600}
.tag-blue{background:rgba(37,99,235,.12);color:#93c5fd}
.tag-green{background:rgba(16,185,129,.12);color:#6ee7b7}
.tag-yellow{background:rgba(245,158,11,.12);color:#fcd34d}
</style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="icon">🏥</div>
    <div class="name">Clinic<span>OS</span></div>
  </div>
  <nav class="sidebar-nav" id="sidebar-nav"></nav>
  <div class="sidebar-user">
    <div class="user-card">
      <div class="user-avatar" id="sidebar-avatar">?</div>
      <div class="user-info">
        <div class="name" id="sidebar-name">Loading…</div>
        <div class="role" id="sidebar-role">—</div>
      </div>
    </div>
    <button class="btn-logout" onclick="doLogout()">🚪 Sign Out</button>
  </div>
</aside>

<!-- MAIN -->
<main class="main">
  <header class="topbar">
    <div class="topbar-title" id="topbar-title">Dashboard</div>
    <div class="topbar-search">
      <span>🔍</span>
      <input type="text" placeholder="Search doctors, medicines…" oninput="globalSearch(this.value)" id="global-search"/>
    </div>
    <button class="notif-btn" title="Notifications">🔔</button>
  </header>
  <div class="content" id="main-content">
    <div class="loading"><span class="spinner"></span> Loading ClinicOS…</div>
  </div>
</main>

<!-- CART FAB -->
<button class="cart-icon-btn" onclick="toggleCart()" id="cart-fab" style="display:none">
  🛒<span class="cart-count" id="cart-count">0</span>
</button>

<!-- CART SIDEBAR -->
<div class="cart-sidebar" id="cart-sidebar">
  <div class="cart-header">
    <h3>🛒 My Cart</h3>
    <button class="cart-close" onclick="toggleCart()">✕</button>
  </div>
  <div class="cart-items" id="cart-items-list"></div>
  <div class="cart-footer">
    <div class="cart-total"><span class="label">Subtotal</span><span class="amount" id="cart-total-amt">₹0</span></div>
    <button class="btn btn-primary" style="width:100%" onclick="proceedCheckout()">Proceed to Checkout →</button>
  </div>
</div>

<!-- MODALS -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal-box"></div>
</div>

<!-- VIDEO CALL ROOM -->
<div class="video-room" id="video-room" style="display:none">
  <div class="video-header">
    <div>📞</div>
    <div class="doc-info">
      <h3 id="vc-doctor-name">Dr. —</h3>
      <p id="vc-doctor-spec">Consultation in progress</p>
    </div>
    <div class="call-timer" id="vc-timer">00:00</div>
  </div>
  <div class="video-main">
    <div class="call-waiting" id="call-waiting">
      <div class="ring"><div class="ring2"><div class="ring3">🩺</div></div></div>
      <h3>Connecting to doctor…</h3>
      <p>Please wait, your doctor is being notified</p>
    </div>
    <video id="remoteVideo" autoplay playsinline style="display:none"></video>
    <video id="localVideo" autoplay playsinline muted></video>
  </div>
  <div class="video-controls">
    <button class="vc-btn mute" id="vc-mic" onclick="toggleMic()" title="Mute">🎤</button>
    <button class="vc-btn mute" id="vc-cam" onclick="toggleCam()" title="Camera">📹</button>
    <button class="vc-btn end" onclick="endCall()" title="End Call">📵</button>
  </div>
</div>

<script>
// ════════════════════════════════════════
// STATE
// ════════════════════════════════════════
let currentUser = null;
let currentView = '';
let cart = JSON.parse(localStorage.getItem('clinicos_cart') || '[]');
let selectedSpecialty = '';
let selectedDoctor = null;
let selectedDate = '';
let selectedSlot = '';
let bookingApptId = null;
let bookingAmount = 0;
let callRoom = '';
let localStream = null;
let callTimerInterval = null;
let callSeconds = 0;
let micOn = true, camOn = true;
let vcDoctorName = '', vcDoctorSpec = '';

// ════════════════════════════════════════
// BOOT
// ════════════════════════════════════════
async function boot() {
  try {
    const res = await fetch('/api/auth/me');
    if (!res.ok) { location.href = '/login'; return; }
    const data = await res.json();
    currentUser = data.user;
    setupSidebar();
    navigateTo('dashboard');
  } catch(e) { location.href = '/login'; }
}

function setupSidebar() {
  const u = currentUser;
  document.getElementById('sidebar-name').textContent = u.name;
  document.getElementById('sidebar-role').textContent = u.role === 'doctor' ? '👨‍⚕️ Doctor' : u.role === 'admin' ? '🔧 Admin' : '🏥 Patient';
  const av = document.getElementById('sidebar-avatar');
  if (u.avatar_url) {
    av.innerHTML = `<img src="${u.avatar_url}" onerror="this.parentNode.textContent='${u.name[0]}'"/>`;
  } else { av.textContent = u.name[0]; }

  const patientNav = [
    {id:'dashboard', icon:'🏠', label:'Dashboard'},
    {id:'find-doctor', icon:'👨‍⚕️', label:'Find a Doctor'},
    {id:'appointments', icon:'📅', label:'My Appointments'},
    {id:'medicines', icon:'💊', label:'Medicine Store'},
    {id:'prescriptions', icon:'📋', label:'Prescriptions'},
    {id:'vaccination', icon:'💉', label:'Vaccination'},
    {id:'profile', icon:'👤', label:'My Profile'},
  ];
  const doctorNav = [
    {id:'dashboard', icon:'🏠', label:'Dashboard'},
    {id:'appointments', icon:'📅', label:'Patient Queue'},
    {id:'prescriptions', icon:'📋', label:'Prescriptions'},
    {id:'vaccination', icon:'💉', label:'Vaccination'},
    {id:'profile', icon:'👤', label:'My Profile'},
  ];
  const nav = u.role === 'doctor' ? doctorNav : patientNav;
  let html = '';
  for (const item of nav) {
    html += `<div class="nav-item" id="nav-${item.id}" onclick="navigateTo('${item.id}')">
      <span class="icon">${item.icon}</span>${item.label}
    </div>`;
  }
  document.getElementById('sidebar-nav').innerHTML = html;
  if (u.role === 'patient') {
    document.getElementById('cart-fab').style.display = 'flex';
  }
  updateCartBadge();
}

function navigateTo(view, extra) {
  currentView = view;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const navEl = document.getElementById('nav-' + view);
  if (navEl) navEl.classList.add('active');
  const titles = {
    'dashboard':'Dashboard','find-doctor':'Find a Doctor','appointments':'Appointments',
    'medicines':'Medicine Store','prescriptions':'Prescriptions','vaccination':'Vaccination',
    'profile':'My Profile',
  };
  document.getElementById('topbar-title').textContent = titles[view] || view;

  const content = document.getElementById('main-content');
  content.innerHTML = '<div class="loading"><span class="spinner"></span> Loading…</div>';

  if (view === 'dashboard') renderDashboard();
  else if (view === 'find-doctor') renderFindDoctor();
  else if (view === 'appointments') renderAppointments();
  else if (view === 'medicines') renderMedicines(extra);
  else if (view === 'prescriptions') renderPrescriptions();
  else if (view === 'vaccination') renderVaccination();
  else if (view === 'profile') renderProfile();
}

async function doLogout() {
  await fetch('/api/auth/logout', {method:'POST'});
  location.href = '/login';
}

// ════════════════════════════════════════
// DASHBOARD
// ════════════════════════════════════════
async function renderDashboard() {
  const [apptRes, rxRes] = await Promise.all([
    fetch('/api/appointments'), fetch('/api/prescriptions')
  ]);
  const appts = (await apptRes.json()).appointments || [];
  const rxs = (await rxRes.json()).prescriptions || [];
  const u = currentUser;
  const isDoctor = u.role === 'doctor';

  const upcoming = appts.filter(a => a.status === 'confirmed').length;
  const completed = appts.filter(a => a.status === 'completed').length;
  const today = new Date().toDateString();
  const todayAppts = isDoctor
    ? appts.filter(a => new Date(a.appt_date).toDateString() === today)
    : appts.filter(a => a.status === 'confirmed').slice(0, 3);

  const c = document.getElementById('main-content');
  c.innerHTML = `
  <div class="page active">
    <div class="page-header">
      <h1>Good ${getGreeting()}, ${u.name.split(' ')[0]} 👋</h1>
      <p>${isDoctor ? 'Manage your patient consultations' : 'Your personal health dashboard'} — ${new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'})}</p>
    </div>
    <div class="grid-4" style="margin-bottom:24px">
      <div class="stat-card blue">
        <div class="stat-icon">📅</div>
        <div class="stat-value">${upcoming}</div>
        <div class="stat-label">${isDoctor ? 'Upcoming Patients' : 'Upcoming Appointments'}</div>
        <div class="stat-change neutral">This week</div>
      </div>
      <div class="stat-card green">
        <div class="stat-icon">✅</div>
        <div class="stat-value">${completed}</div>
        <div class="stat-label">Completed</div>
        <div class="stat-change up">All time</div>
      </div>
      <div class="stat-card yellow">
        <div class="stat-icon">📋</div>
        <div class="stat-value">${rxs.length}</div>
        <div class="stat-label">Prescriptions</div>
        <div class="stat-change neutral">Issued</div>
      </div>
      <div class="stat-card purple">
        <div class="stat-icon">${isDoctor ? '⭐' : '💊'}</div>
        <div class="stat-value">${isDoctor ? u.rating||'4.5' : cart.length}</div>
        <div class="stat-label">${isDoctor ? 'Rating' : 'Cart Items'}</div>
        <div class="stat-change neutral">${isDoctor ? 'Patient reviews' : 'In cart'}</div>
      </div>
    </div>
    <div class="grid-2">
      <div class="card">
        <div class="section-title">📅 ${isDoctor ? "Today's Queue" : "Upcoming Appointments"}</div>
        ${todayAppts.length === 0
          ? `<div class="empty-state" style="padding:30px 0">
               <div class="icon">📭</div>
               <p>${isDoctor ? 'No patients today' : 'No upcoming appointments'}</p>
             </div>`
          : todayAppts.slice(0,3).map(a => `
            <div class="appt-card" style="margin-bottom:10px">
              <div class="appt-avatar">${isDoctor
                ? (a.patient_name||'P')[0]
                : `<img src="${a.doctor_avatar||''}" onerror="this.parentNode.textContent='${(a.doctor_name||'D')[0]}'"/>`
              }</div>
              <div class="appt-info">
                <div class="appt-doc-name">${isDoctor ? (a.patient_name||'Patient') : (a.doctor_name||'Doctor')}</div>
                <div class="appt-spec">${isDoctor ? (a.reason||'Consultation') : (a.specialty||'Specialist')}</div>
                <div class="appt-meta">
                  <span class="appt-meta-item">📅 ${a.appt_date}</span>
                  <span class="appt-meta-item">🕐 ${a.slot}</span>
                </div>
              </div>
              <span class="status-badge status-${a.status}">${a.status}</span>
            </div>`).join('')}
        <button class="btn btn-secondary btn-sm" style="margin-top:8px" onclick="navigateTo('appointments')">View All →</button>
      </div>
      <div class="card">
        <div class="section-title">⚡ Quick Actions</div>
        <div style="display:flex;flex-direction:column;gap:10px">
          ${isDoctor ? `
            <button class="btn btn-primary" onclick="navigateTo('appointments')">📋 View Patient Queue</button>
            <button class="btn btn-secondary" onclick="navigateTo('prescriptions')">✍️ Write Prescription</button>
            <button class="btn btn-secondary" onclick="navigateTo('vaccination')">💉 Vaccination Registry</button>
          ` : `
            <button class="btn btn-primary" onclick="navigateTo('find-doctor')">👨‍⚕️ Book Consultation</button>
            <button class="btn btn-secondary" onclick="navigateTo('medicines')">💊 Order Medicines</button>
            <button class="btn btn-secondary" onclick="navigateTo('vaccination')">👶 Register Newborn</button>
            <button class="btn btn-secondary" onclick="navigateTo('prescriptions')">📋 My Prescriptions</button>
          `}
        </div>
      </div>
    </div>
  </div>`;
}

function getGreeting() {
  const h = new Date().getHours();
  return h < 12 ? 'Morning' : h < 17 ? 'Afternoon' : 'Evening';
}

// ════════════════════════════════════════
// FIND DOCTOR
// ════════════════════════════════════════
async function renderFindDoctor() {
  const c = document.getElementById('main-content');
  if (selectedDoctor) { renderBookingStep(); return; }
  if (selectedSpecialty) { renderDoctorList(); return; }

  // Step 1: Choose specialty
  const res = await fetch('/api/specialties');
  const {specialties} = await res.json();
  c.innerHTML = `
  <div class="page active">
    <div class="page-header"><h1>Find a Doctor</h1><p>Choose a specialization to find the best doctor for you</p></div>
    <div class="progress-steps" style="max-width:600px">
      <div class="step current"><div class="step-circle">1</div><div class="step-label">Specialization</div></div>
      <div class="step"><div class="step-circle">2</div><div class="step-label">Doctor</div></div>
      <div class="step"><div class="step-circle">3</div><div class="step-label">Date & Slot</div></div>
      <div class="step"><div class="step-circle">4</div><div class="step-label">Payment</div></div>
    </div>
    <div class="specialty-grid">
      ${specialties.map(s => `
        <div class="spec-card" onclick="chooseSpecialty('${s.name}')">
          <div class="spec-icon">${s.icon}</div>
          <div class="spec-name">${s.name}</div>
          <div class="spec-desc">${s.desc}</div>
        </div>`).join('')}
    </div>
  </div>`;
}

async function chooseSpecialty(spec) {
  selectedSpecialty = spec;
  renderDoctorList();
}

async function renderDoctorList() {
  const c = document.getElementById('main-content');
  c.innerHTML = '<div class="loading"><span class="spinner"></span> Fetching doctors…</div>';
  const res = await fetch(`/api/doctors?specialty=${encodeURIComponent(selectedSpecialty)}`);
  const {doctors} = await res.json();
  c.innerHTML = `
  <div class="page active">
    <div class="back-btn" onclick="selectedSpecialty='';renderFindDoctor()">← Back to Specializations</div>
    <div class="page-header"><h1>${selectedSpecialty} Specialists</h1><p>${doctors.length} doctor${doctors.length!==1?'s':''} available</p></div>
    <div class="progress-steps" style="max-width:600px">
      <div class="step done"><div class="step-circle">✓</div><div class="step-label">Specialization</div></div>
      <div class="step current"><div class="step-circle">2</div><div class="step-label">Doctor</div></div>
      <div class="step"><div class="step-circle">3</div><div class="step-label">Date & Slot</div></div>
      <div class="step"><div class="step-circle">4</div><div class="step-label">Payment</div></div>
    </div>
    ${doctors.length === 0
      ? `<div class="empty-state"><div class="icon">🔎</div><h3>No doctors found</h3><p>No ${selectedSpecialty} specialists available right now.</p></div>`
      : doctors.map(d => `
        <div class="doctor-card" onclick="chooseDoctor(${d.id})" style="margin-bottom:14px">
          ${d.avatar_url
            ? `<img class="doc-avatar" src="${d.avatar_url}" onerror="this.style.display='none'" loading="lazy"/>`
            : `<div class="doc-avatar-placeholder">${(d.name||'D')[0]}</div>`}
          <div class="doc-info">
            <div class="doc-name">${d.name}</div>
            <span class="doc-spec">${d.specialty}</span>
            <div class="doc-meta">
              <span class="doc-meta-item"><span class="stars">★</span> ${d.rating} (${d.reviews_count} reviews)</span>
              <span class="doc-meta-item">🏆 ${d.experience}</span>
              <span class="available-badge">Available Today</span>
            </div>
            <div class="doc-hosp">🏥 ${d.hospital}</div>
          </div>
          <div style="text-align:right;flex-shrink:0">
            <div class="doc-fee">₹${d.fee}<span>/consult</span></div>
            <button class="btn btn-primary btn-sm" style="margin-top:10px">Book Now</button>
          </div>
        </div>`).join('')}
  </div>`;
}

function selectSlot(slot) {
  selectedSlot = slot;
  document.querySelectorAll('.slot-btn').forEach(el => {
    el.classList.toggle('selected', el.textContent.trim() === slot);

async function confirmBooking() {
  if (!selectedSlot) return;
  const reason = document.getElementById('visit-reason').value || 'General Consultation';
  const btn = document.getElementById('book-btn');
  btn.innerHTML = '<span class="spinner"></span> Booking…'; btn.disabled = true;
  try {
    const res = await fetch('/api/appointments/book', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({doctor_id:selectedDoctor.id, date:selectedDate, slot:selectedSlot, reason})
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Booking failed');
    bookingApptId = data.appointment_id;
    bookingAmount = data.amount;
    callRoom = data.call_room;
    vcDoctorName = selectedDoctor.name;
    vcDoctorSpec = selectedDoctor.specialty;
    renderPaymentStep();
  } catch(e) {
    showToast('❌ ' + e.message, 'error');

}

async function startVideoCall(apptId, docName, docSpec) {
  if (docName) { vcDoctorName = docName; vcDoctorSpec = docSpec; }
  document.getElementById('vc-doctor-name').textContent = vcDoctorName || selectedDoctor?.name || 'Doctor';
  document.getElementById('vc-doctor-spec').textContent = vcDoctorSpec || selectedDoctor?.specialty || 'Specialist';
  document.getElementById('video-room').style.display = 'flex';
  document.getElementById('call-waiting').style.display = 'flex';
  document.getElementById('remoteVideo').style.display = 'none';

  try {
    localStream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
    document.getElementById('localVideo').srcObject = localStream;
    // Simulate doctor joining after 4 seconds
    setTimeout(() => {
      document.getElementById('call-waiting').style.display = 'none';
      document.getElementById('remoteVideo').style.display = 'block';
      // Mirror local video as "remote" for demo
      document.getElementById('remoteVideo').srcObject = localStream;
      startCallTimer();
    }, 4000);
  } catch(e) {
    showToast('⚠️ Camera/mic access denied. Please allow permissions.', 'error');
    document.getElementById('video-room').style.display = 'none';
  }
}

function startCallTimer() {
  callSeconds = 0;
  callTimerInterval = setInterval(() => {
    callSeconds++;
    const m = String(Math.floor(callSeconds/60)).padStart(2,'0');
    const s = String(callSeconds%60).padStart(2,'0');
    document.getElementById('vc-timer').textContent = m + ':' + s;
  }, 1000);
}

function toggleMic() {
  if (!localStream) return;
  micOn = !micOn;
  localStream.getAudioTracks().forEach(t => t.enabled = micOn);
  document.getElementById('vc-mic').classList.toggle('active', !micOn);
  document.getElementById('vc-mic').textContent = micOn ? '🎤' : '🔇';
}
function toggleCam() {
  if (!localStream) return;
  camOn = !camOn;
  localStream.getVideoTracks().forEach(t => t.enabled = camOn);
  document.getElementById('vc-cam').classList.toggle('active', !camOn);
  document.getElementById('vc-cam').textContent = camOn ? '📹' : '📷';
}
function endCall() {
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  clearInterval(callTimerInterval); callSeconds = 0;
  document.getElementById('video-room').style.display = 'none';
  micOn = true; camOn = true;
  document.getElementById('vc-mic').textContent = '🎤';
  document.getElementById('vc-cam').textContent = '📹';
  document.getElementById('vc-timer').textContent = '00:00';
}

// CART
// ════════════════════════════════════════
function addToCart(med) {
  const existing = cart.find(i => i.id === med.id);
  if (existing) existing.qty++;
  else cart.push({id:med.id, name:med.name, price:med.price, emoji:med.image_emoji||'💊', qty:1});
  saveCart(); updateCartBadge();
  showToast(`✅ ${med.name} added to cart`, 'success');
}

function saveCart() { localStorage.setItem('clinicos_cart', JSON.stringify(cart)); }

function updateCartBadge() {
  const total = cart.reduce((s,i) => s+i.qty, 0);
  document.getElementById('cart-count').textContent = total;
  document.getElementById('cart-count').style.display = total > 0 ? 'flex' : 'none';
}

function toggleCart() {
  const sidebar = document.getElementById('cart-sidebar');
  sidebar.classList.toggle('open');
  renderCartItems();
}

function renderCartItems() {
  const list = document.getElementById('cart-items-list');
  if (cart.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="icon">🛒</div><h3>Your cart is empty</h3><p>Add medicines to start</p></div>';
    document.getElementById('cart-total-amt').textContent = '₹0';
    return;
  }
  list.innerHTML = cart.map((item,i) => `
    <div class="cart-item">
      <div class="cart-item-emoji">${item.emoji}</div>
      <div class="cart-item-info">
        <div class="cart-item-name">${item.name}</div>
        <div class="cart-item-price">₹${(item.price * item.qty).toFixed(0)}</div>
      </div>
      <div class="cart-qty">
        <button class="qty-btn" onclick="changeQty(${i},-1)">−</button>
        <span class="qty-num">${item.qty}</span>
        <button class="qty-btn" onclick="changeQty(${i},1)">+</button>
      </div>
    </div>`).join('');
  const sub = cart.reduce((s,i) => s + i.price*i.qty, 0);
  document.getElementById('cart-total-amt').textContent = '₹' + sub.toFixed(0);
}

function changeQty(index, delta) {
  cart[index].qty += delta;
  if (cart[index].qty <= 0) cart.splice(index, 1);
  saveCart(); updateCartBadge(); renderCartItems();
}

function proceedCheckout() {
  if (cart.length === 0) return;
  document.getElementById('cart-sidebar').classList.remove('open');
  renderCheckout();
}

function renderCheckout() {
  const sub = cart.reduce((s,i) => s+i.price*i.qty, 0);
  const delivery = sub >= 500 ? 0 : 49;
  const total = sub + delivery;
  document.getElementById('main-content').innerHTML = `
  <div class="page active">
    <div class="back-btn" onclick="navigateTo('medicines')">← Back to Store</div>
    <div class="page-header"><h1>🛒 Checkout</h1></div>
    <div class="grid-2">
      <div>
        <div class="card" style="margin-bottom:16px">
          <div class="section-title">📦 Order Items (${cart.length})</div>
          ${cart.map(i=>`<div class="cart-item" style="margin-bottom:8px"><div class="cart-item-emoji">${i.emoji}</div><div class="cart-item-info"><div class="cart-item-name">${i.name}</div><div class="cart-item-price">₹${i.price} × ${i.qty} = ₹${(i.price*i.qty).toFixed(0)}</div></div></div>`).join('')}
        </div>
        <div class="card">
          <div class="section-title">🚚 Delivery Address</div>
          <div class="form-group"><label>Full Address</label><textarea id="del-address" rows="3" placeholder="House no, Street, Area, City, State, PIN">${currentUser.address||''}</textarea></div>
          <div class="form-group"><label>Phone</label><input type="tel" id="del-phone" placeholder="+91 XXXXXXXXXX" value="${currentUser.phone||''}"/></div>
        </div>
      </div>
      <div>
        <div class="card" style="margin-bottom:16px">
          <div class="section-title">💰 Price Breakdown</div>
          ${infoRow('🛍️','Subtotal','₹'+sub.toFixed(0))}
          ${infoRow('🚚','Delivery',delivery===0?'<span style="color:var(--green)">FREE</span>':'₹'+delivery)}
          <div class="divider"></div>
          ${infoRow('💳','Total Payable','₹'+total.toFixed(0))}
          ${sub < 500 ? '<div class="info-banner" style="margin-top:12px">🎁 Add ₹'+(500-sub).toFixed(0)+' more for FREE delivery!</div>' : ''}
        </div>
        <div class="card">
          <div class="section-title">💳 Payment Method</div>
          <div class="payment-methods">
            <div class="pay-method active" id="cpm-upi" onclick="switchCartPay('upi')"><div class="pm-icon">📱</div><div class="pm-name">UPI / QR</div></div>
            <div class="pay-method" id="cpm-cod" onclick="switchCartPay('cod')"><div class="pm-icon">💵</div><div class="pm-name">Cash on Delivery</div></div>
          </div>
          <div id="cart-pay-upi">
            <div class="qr-box">
              <div class="qr-img" id="cart-qr"></div>
              <div class="upi-id">clinicos@ybl</div>
              <div class="upi-note">Amount: ₹${total.toFixed(0)}</div>
            </div>
          </div>
          <div id="cart-pay-cod" style="display:none">
            <div class="info-banner">💵 Pay in cash when your order is delivered. Easy!</div>
          </div>
          <button class="btn btn-primary btn-lg" style="width:100%;margin-top:16px" onclick="placeOrder('${total}','${delivery}','${sub}')">
            Place Order ₹${total.toFixed(0)} →
          </button>
        </div>
      </div>
    </div>
  </div>`;

  try {
    new QRCode(document.getElementById('cart-qr'), {
      text:`upi://pay?pa=clinicos@ybl&pn=ClinicOS&am=${total}&tn=MedicineOrder`,
      width:160, height:160, colorDark:'#1e293b', colorLight:'#ffffff', correctLevel:QRCode.CorrectLevel.H
    });
  } catch(e) {}
}

function switchCartPay(m) {
  ['upi','cod'].forEach(x => {
    document.getElementById('cpm-'+x)?.classList.toggle('active', x===m);
    document.getElementById('cart-pay-'+x).style.display = x===m?'block':'none';
  });
}

async function placeOrder(total, delivery, sub) {
  const address = document.getElementById('del-address')?.value?.trim();
  const phone = document.getElementById('del-phone')?.value?.trim();
  if (!address) { showToast('❌ Please enter delivery address', 'error'); return; }
  const btn = event.target;
  btn.innerHTML = '<span class="spinner"></span> Placing order…'; btn.disabled = true;
  await sleep(2500);
  try {
    const res = await fetch('/api/orders', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({items:cart, address, phone, total:parseFloat(total), delivery_fee:parseFloat(delivery), subtotal:parseFloat(sub)})
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    cart = []; saveCart(); updateCartBadge();
    document.getElementById('main-content').innerHTML = `
    <div class="page active" style="max-width:520px;margin:0 auto;text-align:center;padding:60px 20px">
      <div style="font-size:80px;margin-bottom:20px">📦</div>
      <h1 style="font-size:24px;font-weight:800;margin-bottom:8px">Order Placed!</h1>
      <p style="color:var(--text2);margin-bottom:24px">Your medicines will be delivered in 2–3 business days</p>
      <div class="card" style="text-align:left;margin-bottom:24px">
        ${infoRow('🎟️','Order ID','#ORD-'+data.order_id)}
        ${infoRow('💰','Amount Paid','₹'+total)}
        ${infoRow('🚚','Delivery',data.delivery_fee===0?'Free':'₹'+data.delivery_fee)}
        ${infoRow('📦','Est. Delivery',data.estimated_delivery||'2–3 days')}
      </div>
      <button class="btn btn-secondary" onclick="navigateTo('medicines')">Continue Shopping</button>
    </div>`;
  } catch(e) {
    showToast('❌ ' + e.message, 'error');
    btn.innerHTML = `Place Order ₹${total} →`; btn.disabled = false;
  }
}

function openPrescriptionModal(apptId, patientId) {
  let medRows = 1;
  showModal(`
    <h2>✍️ Write Prescription</h2>
    <p class="sub">Appointment #${apptId}</p>
    <div class="form-group"><label>Diagnosis</label><input type="text" id="rx-diagnosis" placeholder="e.g. Viral fever, Hypertension"/></div>
    <div class="section-title" style="font-size:13px">Medicines</div>
    <div id="rx-meds">
      ${rxMedRow(0)}
    </div>
    <button class="btn btn-secondary btn-sm" style="margin-bottom:16px" onclick="addRxMed()">+ Add Medicine</button>
    <div class="form-group"><label>Advice / Notes</label><textarea id="rx-advice" rows="2" placeholder="Rest well, drink plenty of fluids…"></textarea></div>
    <div class="form-group"><label>Follow-up Date</label><input type="date" id="rx-followup" min="${new Date().toISOString().split('T')[0]}"/></div>
    <button class="btn btn-primary" style="width:100%" onclick="submitPrescription(${apptId},${patientId})">Issue Prescription</button>
  `);
}

let rxMedCount = 1;
function rxMedRow(i) {
  return `<div class="form-row-2" id="rx-med-${i}" style="margin-bottom:8px">
    <div class="form-group"><label>Medicine Name</label><input type="text" id="rxm-name-${i}" placeholder="e.g. Paracetamol 500mg"/></div>
    <div class="form-row-2" style="gap:8px">
      <div class="form-group"><label>Dosage</label><input type="text" id="rxm-dose-${i}" placeholder="1-0-1"/></div>
      <div class="form-group"><label>Duration</label><input type="text" id="rxm-dur-${i}" placeholder="5 days"/></div>
    </div>
  </div>`;
}
function addRxMed() {
  const container = document.getElementById('rx-meds');
  const div = document.createElement('div');
  div.innerHTML = rxMedRow(rxMedCount++);
  container.appendChild(div.firstChild);
}

async function submitPrescription(apptId, patientId) {
  const meds = [];
  for (let i = 0; i < rxMedCount; i++) {
    const nameEl = document.getElementById('rxm-name-' + i);
    if (nameEl && nameEl.value.trim()) {
      meds.push({
        name: nameEl.value.trim(),
        dosage: document.getElementById('rxm-dose-'+i)?.value || '',
        duration: document.getElementById('rxm-dur-'+i)?.value || '',
      });
    }
  }
  const body = {
    appointment_id: apptId, patient_id: patientId,
    diagnosis: document.getElementById('rx-diagnosis')?.value || '',
    medicines: meds,
    advice: document.getElementById('rx-advice')?.value || '',
    follow_up: document.getElementById('rx-followup')?.value || '',
  };
  const res = await fetch('/api/prescriptions', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  const data = await res.json();
  if (res.ok) { closeModal(); showToast('✅ Prescription issued!', 'success'); rxMedCount=1; renderAppointments(); }
  else showToast('❌ ' + data.error, 'error');
}

async function registerNewborn() {
  const body = {
    baby_name: document.getElementById('nb-name')?.value,
    gender: document.getElementById('nb-gender')?.value,
    dob: document.getElementById('nb-dob')?.value,
    birth_weight: document.getElementById('nb-weight')?.value,
    blood_group: document.getElementById('nb-blood')?.value,
    delivery_place: document.getElementById('nb-place')?.value,
    mother_name: document.getElementById('nb-mother')?.value,
    father_name: document.getElementById('nb-father')?.value,
    address: document.getElementById('nb-address')?.value,
    phone: document.getElementById('nb-phone')?.value,
    birth_doses_given: document.getElementById('nb-birth-doses')?.checked,
  };
  const res = await fetch('/api/newborns', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  const data = await res.json();
  if (res.ok) { closeModal(); showToast('✅ Baby registered! Vaccination schedule created.', 'success'); renderVaccination(); }
  else showToast('❌ ' + data.error, 'error');
}

async function administerVaccine(babyId, vaccineName) {
  const batchNo = prompt(`Enter batch number for:\n${vaccineName}`, 'BATCH-' + Date.now().toString().slice(-6));
  if (!batchNo) return;
  const res = await fetch(`/api/newborns/${babyId}/vaccine`, {
    method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({vaccine_name: vaccineName, batch_no: batchNo})
  });
  const data = await res.json();
  if (res.ok) { showToast('✅ Vaccine recorded!', 'success'); renderVaccination(); }
  else showToast('❌ ' + data.error, 'error');
}

    phone: document.getElementById('p-phone')?.value,
    dob: document.getElementById('p-dob')?.value,
    address: document.getElementById('p-address')?.value,
    blood_group: document.getElementById('p-blood')?.value,
  };
  const res = await fetch('/api/profile', {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  const data = await res.json();
  if (res.ok) { currentUser = data.user; setupSidebar(); showToast('✅ Profile updated!', 'success'); }
  else showToast('❌ ' + data.error, 'error');
}

// ════════════════════════════════════════
// SEARCH
// ════════════════════════════════════════
function globalSearch(q) {
  if (q.length > 2) {
    if (currentView === 'medicines') { searchMedicines(q); return; }
    if (q.toLowerCase().includes('doctor') || q.toLowerCase().includes('consult')) navigateTo('find-doctor');
    else if (q.toLowerCase().includes('med') || q.toLowerCase().includes('tablet')) navigateTo('medicines');
    else if (q.toLowerCase().includes('vaccine') || q.toLowerCase().includes('baby')) navigateTo('vaccination');
  }
}

// ════════════════════════════════════════
// MODAL HELPER
// ════════════════════════════════════════
function showModal(html) {
  const overlay = document.getElementById('modal-overlay');
  const box = document.getElementById('modal-box');
  box.innerHTML = `<button class="modal-close" onclick="closeModal()">✕</button>${html}`;
  overlay.classList.add('open');
}
function closeModal(e) {
  if (!e || e.target === document.getElementById('modal-overlay'))
    document.getElementById('modal-overlay').classList.remove('open');
}

// ════════════════════════════════════════
// TOAST
// ════════════════════════════════════════
function showToast(msg, type='success') {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const t = document.createElement('div');
  t.className = 'toast';
  t.style.cssText = `position:fixed;bottom:32px;left:50%;transform:translateX(-50%);padding:12px 22px;border-radius:12px;font-size:13.5px;font-weight:600;z-index:9999;animation:fadeIn .2s ease;font-family:'Inter',sans-serif;${
    type==='success' ? 'background:rgba(16,185,129,.95);color:#fff;' : 'background:rgba(239,68,68,.95);color:#fff;'
  }`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ════════════════════════════════════════
// INIT
// ════════════════════════════════════════
boot();
</script>
</body>
</html>
